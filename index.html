<style>

/* Concepto: parte de turno. Una tarjeta azul con la fecha y la acción principal, una cuadrícula de estaciones con su código, y una barra inferior con el botón Enviar en el centro. */
:root{--bg:#edf0f6;--sf:#fff;--sf2:#f3f5fa;--ink:#0e1a33;--mu:#5a6884;--ln:#dde3ee;--nv:#1a2d68;--nv2:#2a47a0;--ac:#2a47a0;--acb:#24409a;--acs:#e2e8fb;--yl:#f0b72f;--yli:#2a2000;--ok:#146c38;--oks:#dff2e6;--wa:#9a4d00;--was:#fff0d2;--er:#b42318;--ers:#fde5e2;--avl:90%;--avf:28%;--sh:0 1px 2px rgba(14,26,51,.05),0 8px 22px rgba(14,26,51,.07);--r:20px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1120;--sf:#131b2f;--sf2:#1a2440;--ink:#edf1fb;--mu:#93a0bc;--ln:#25314f;--nv:#13224f;--nv2:#233c8a;--ac:#8fa8f2;--acb:#3558c9;--acs:#1b2956;--yl:#f0b72f;--yli:#2a2000;--ok:#4cc38a;--oks:#12301f;--wa:#f2b45a;--was:#33270f;--er:#f08a7e;--ers:#3a1a1c;--avl:28%;--avf:84%;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1120;--sf:#131b2f;--sf2:#1a2440;--ink:#edf1fb;--mu:#93a0bc;--ln:#25314f;--nv:#13224f;--nv2:#233c8a;--ac:#8fa8f2;--acb:#3558c9;--acs:#1b2956;--yl:#f0b72f;--yli:#2a2000;--ok:#4cc38a;--oks:#12301f;--wa:#f2b45a;--was:#33270f;--er:#f08a7e;--ers:#3a1a1c;--avl:28%;--avf:84%;--sh:none;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:500 15px/1.45 Manrope,-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:var(--ink)}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.mu{color:var(--mu);width:18px;height:18px}.ic.okc{color:var(--ok)}.ic.wi{color:var(--wa);width:18px;height:18px}
h1,h3,h4{margin:0}
.pt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:16px;min-height:62px}
.pt h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
.pg{padding-top:14px;display:flex;flex-direction:column;gap:14px}
main.d1{padding-bottom:116px;padding-top:6px}main.d0{padding-bottom:100px}
.card{background:var(--sf);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--ln);overflow:hidden}
.pad{padding:16px}
/* tarjeta del día */
.ban{position:relative;overflow:hidden;background:linear-gradient(150deg,var(--nv) 0%,var(--nv2) 100%);color:#fff;border-radius:28px;padding:16px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--sh)}
.ban::after{content:"";position:absolute;right:-50px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.ban>*{position:relative;z-index:1}
.ban .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ban .dt{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dd{text-align:center;min-width:0}.dd b{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.05}.dd span{font-size:13.5px;opacity:.82}
.pr{display:flex;align-items:center;gap:12px}.pb{flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.2);overflow:hidden}.pb i{display:block;height:100%;background:var(--yl);border-radius:6px}.pr b{font-size:15px;font-variant-numeric:tabular-nums}
.cfl{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.14);border-radius:15px;padding:10px 12px}.cfl span{flex:1;font-weight:700}
.logo{display:block}
.bst{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;opacity:.92;margin-top:-6px}.bst b{font-weight:800}
.bal{display:flex;align-items:center;gap:10px;background:var(--yl);color:var(--yli);border-radius:14px;padding:10px 12px;font-weight:700;font-size:14px}.bal .ic{width:20px;height:20px}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--sf);border:1px solid var(--ln);flex:none;color:var(--ink)}

.seg{display:flex;background:var(--ln);border-radius:14px;padding:3px;gap:2px}

.seg button.on{background:var(--sf);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg.dk{background:rgba(255,255,255,.16)}.seg.dk button{color:#fff;min-height:34px}.seg.dk button.on{background:#fff;color:var(--nv);box-shadow:none}
/* semana */
.strip{padding:10px 10px 12px;display:flex;flex-direction:column;gap:8px}
.sr{display:flex;align-items:center;justify-content:space-between;padding:0 4px}.sr b{font-size:15px;font-weight:800;text-transform:capitalize}
.sc{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dc{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 7px;border-radius:14px;color:var(--ink);background:var(--sf2);text-align:center;position:relative}
.dc i{font-style:normal;font-size:11px;color:var(--mu);font-weight:700}.dc b{font-size:17px;font-weight:800}
.dc.off{opacity:.45}.dc.sel{background:var(--nv2);color:#fff;opacity:1}.dc.sel i{color:#fff;opacity:.8}
.dc.td b::after{content:"";display:block;width:5px;height:5px;border-radius:50%;background:var(--yl);margin:2px auto 0}
.dc u{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--ok)}
/* estaciones */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{display:flex;flex-direction:column;gap:7px;width:100%;min-height:112px;padding:12px;border-radius:20px;background:var(--sf);border:1.5px solid var(--ln);box-shadow:var(--sh);text-align:left}
.st.nil{background:transparent;border-style:dashed;box-shadow:none}
.st.w{border-color:var(--wa)}
.st:active,.li:active,.tile:active{background:var(--sf2)}
.st .h{display:flex;align-items:center;justify-content:space-between;gap:6px}.st .h span:last-child{display:flex;gap:4px}
.cd{font-weight:800;font-size:12px;letter-spacing:.07em;background:var(--nv2);color:#fff;border-radius:8px;padding:3px 8px}
.st .pn{font-size:12.5px;font-weight:700;color:var(--mu);line-height:1.2}
.st .who{display:flex;align-items:center;gap:8px;margin-top:auto;font-weight:800;font-size:14.5px;line-height:1.15;min-width:0}
.st .who>span:last-child{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st .who.nil{color:var(--mu);font-weight:700}
.wt{color:var(--wa)!important;font-size:11.5px;font-weight:700;line-height:1.2}
.st .wt{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* listas */
.li{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:10px 16px;border-top:1px solid var(--ln);color:var(--ink)}
.li:first-child{border-top:0}.li.mut{opacity:.5}
.lt{flex:1;min-width:0;display:flex;flex-direction:column}
.lt b{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lt small{font-size:13px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ico{width:42px;height:42px;border-radius:13px;background:var(--acs);color:var(--ac);display:grid;place-items:center;flex:none}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;font-size:14px;background:hsl(var(--h) 40% var(--avl));color:hsl(var(--h) 48% var(--avf))}
.av.lg{width:58px;height:58px;font-size:19px}.av.nil{background:transparent;border:2px dashed var(--ln);color:var(--mu)}.av.sm{width:30px;height:30px;font-size:11.5px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--sf2);color:var(--mu);white-space:nowrap;border:1px solid var(--ln)}
.pill.ok{background:var(--oks);color:var(--ok);border-color:transparent}.pill.wa{background:var(--was);color:var(--wa);border-color:transparent}.pill.er{background:var(--ers);color:var(--er);border-color:transparent}
button.pill{cursor:pointer}
.btn{min-height:50px;border-radius:16px;font-weight:700;font-size:15.5px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--sf);border:1px solid var(--ln);color:var(--ink);text-align:center;text-decoration:none}
.btn.p{background:var(--acb);border-color:transparent;color:#fff}.btn.y{background:var(--yl);border-color:transparent;color:var(--yli)}.btn.gh{background:rgba(255,255,255,.16);border-color:transparent;color:#fff}
.btn.wa{background:#25d366;border-color:transparent;color:#05210f}.btn.dg{color:var(--er)}.btn.full{width:100%}.grow{flex:1}
.btn:active,.chip:active,.rb:active{transform:scale(.97)}
.row{display:flex;gap:10px;align-items:center}.row.sp{justify-content:space-between}.row.wr{flex-wrap:wrap}
.note{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:16px;background:var(--sf);border:1px solid var(--ln);width:100%;font-weight:600}
.note.wa{background:var(--was);color:var(--wa);border-color:transparent}.note.ok{background:var(--oks);color:var(--ok);border-color:transparent}.note span{flex:1}
.hint{color:var(--mu);font-size:13.5px;margin:0}.mu{color:var(--mu);font-size:13.5px}
.sl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--mu);margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--ln);background:var(--sf);font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;gap:8px;text-align:center}
.chip.on{background:var(--acs);border-color:var(--ac)}.chip.v{background:var(--was);border-color:var(--wa);color:var(--wa)}.chip.y{background:var(--yl);border-color:transparent;color:var(--yli)}.chip.fr{padding-left:5px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;min-height:48px;border:1px solid var(--ln);background:var(--sf);border-radius:14px;padding:0 13px;font-size:16px}
textarea{padding:12px 13px;min-height:160px}
.fl{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--mu)}.fl input,.fl select{font-weight:500;color:var(--ink)}
.stp{display:flex;align-items:center;justify-content:center;gap:26px}.stp b{font-size:42px;font-weight:800;min-width:60px;text-align:center;font-variant-numeric:tabular-nums}
.rb{width:56px;height:56px;border-radius:50%;background:var(--sf2);border:1px solid var(--ln);font-size:28px;text-align:center;display:grid;place-items:center;line-height:1}
.rk{width:28px;font-weight:800;color:var(--mu);font-variant-numeric:tabular-nums}
.num{font-size:32px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;text-align:right}.num small{display:block;font-size:12px;font-weight:600;color:var(--mu);margin-top:2px}
summary{list-style:none;cursor:pointer;font-weight:700;display:flex;align-items:center;justify-content:space-between;min-height:30px}
summary::-webkit-details-marker{display:none}details[open] summary{margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal div{aspect-ratio:1;display:grid;place-items:center;border-radius:11px;background:var(--sf2);font-weight:600;cursor:pointer}
.cal .no{background:var(--ln);color:var(--mu)}.cal .h{background:none;aspect-ratio:auto;font-size:12px;color:var(--mu);cursor:default}.cal .td{outline:2px solid var(--yl)}.cal .dot{background:none;cursor:default}
.pre{white-space:pre-wrap;margin:0;font:500 14px/1.55 Manrope,system-ui,sans-serif}
/* barra inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{display:grid;grid-template-columns:1fr 1fr 78px 1fr 1fr}
.tb{position:relative;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mu);font-size:11.5px;font-weight:700;text-align:center}
.tb.on{color:var(--ac)}.tb .ic{width:25px;height:25px}
.bd{position:absolute;top:5px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--er);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.fab{position:relative;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:8px;color:var(--ink);font-size:11.5px;font-weight:800;text-align:center}
.fab i{position:absolute;top:-24px;left:50%;margin-left:-29px;width:58px;height:58px;border-radius:50%;background:var(--yl);color:var(--yli);display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.22);border:4px solid var(--bg)}
.fab i .ic{width:26px;height:26px}
.fab.ok i{background:#25d366;color:#05210f}
/* hojas */
.sh{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,12,30,.55)}
.shp{width:100%;max-width:600px;max-height:90vh;overflow-y:auto;background:var(--bg);border-radius:26px 26px 0 0;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.gr{width:42px;height:5px;border-radius:5px;background:var(--ln);margin:9px auto 0}
.shh{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0 8px}
.shh h3{font-size:20px;font-weight:800}
.shp .in{display:flex;flex-direction:column;gap:14px}
.pid{display:flex;align-items:center;gap:14px}.pid b{font-size:20px;display:block;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;white-space:nowrap;display:flex;gap:14px;align-items:center}
.toast.show{opacity:1;pointer-events:auto}.tu{color:inherit;text-decoration:underline;font-weight:800;min-height:28px;padding:0 4px}
@media (prefers-reduced-motion:reduce){.shp{animation:none}.toast{transition:none}.btn:active,.chip:active,.rb:active{transform:none}}
.wz{padding-top:14px;padding-bottom:40px;display:flex;flex-direction:column;gap:16px}
.wh{display:flex;align-items:center;gap:12px;padding-top:16px}.wh .pb{background:var(--ln)}.wh .pb i{background:var(--acb)}.wh b{font-size:13px;color:var(--mu);white-space:nowrap}
.wz h1{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
.wz .lead{font-size:16px;color:var(--mu);margin:0}
.hero{display:flex;flex-direction:column;gap:14px;background:linear-gradient(150deg,var(--nv),var(--nv2));color:#fff;border-radius:28px;padding:22px}.hero h1{color:#fff}.hero p{margin:0;opacity:.88}
.mark{width:54px;height:54px;border-radius:16px;background:var(--yl);color:var(--yli);display:grid;place-items:center}.mark .ic{width:30px;height:30px}
.q{display:flex;flex-direction:column;gap:6px;background:var(--acs);border-radius:18px;padding:14px 16px}.q b{font-size:17px}.q span{color:var(--mu);font-size:14px}
.cta{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;padding-top:6px}
.chip.x{background:var(--ers);border-color:transparent;color:var(--er)}
.sw{display:flex;align-items:center;gap:10px}
.ln{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 0}.ln>span{flex:1;font-weight:700}

main.wzm{padding-bottom:20px}
</style>

<script>
const $=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let TODAY=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const addD=(d,n)=>{const x=new Date(d+"T12:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const mon=d=>{const x=new Date(d+"T12:00:00Z");return addD(d,-((x.getUTCDay()+6)%7))};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fl=d=>new Date(d+"T12:00:00Z").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long",timeZone:"UTC"});
const fs=d=>new Date(d+"T12:00:00Z").toLocaleDateString("es-ES",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"});
const ini=n=>n.split(" ").map(x=>x[0]).slice(0,2).join("").toUpperCase();

wAddPost:()=>{const n=nm($("wp").value);if(!n)return 1;if(badName(n)){toast("Ese nombre no se puede usar");return 1}if(P().some(x=>x.toLowerCase()===n.toLowerCase())){toast("Ese puesto ya existe");return 1}S.posts.push(n)},
wDelPost:v=>{dropPost(v)},
wPost:v=>{W.posts=W.posts.includes(v)?W.posts.filter(x=>x!==v):[...W.posts,v]},wAll:()=>{W.posts=[...P()]},wNone:()=>{W.posts=[]},
wSave:()=>{const e=$("wn"),n=((e&&e.value)||W.name||"").trim().replace(/[|]/g,"");W.name=n;
if(!n){W.err="Escribe el nombre.";return}
if(badName(n)){W.err="Ese nombre no se puede usar.";return}
if(!W.edit&&OPS().some(x=>x.toLowerCase()===n.toLowerCase())){W.err="Ya tienes a alguien con ese nombre.";return}
if(!W.posts.length){W.err="Marca al menos un puesto que sepa hacer.";return}
if(W.edit)S.ops[n].posts=[...W.posts];else{S.ops[n]={posts:[...W.posts],bajas:[],ap:[],falta:[]};S.order.push(n)}
W.name="";W.posts=[];W.edit=null;W.err="";if(SHEET&&SHEET.t==="addop")SHEET=null;toast("Guardado")},
wEdit:v=>{W.name=v;W.posts=[...S.ops[v].posts];W.edit=v;W.err="";window.scrollTo(0,0)},
wCancel:()=>{W.name="";W.posts=[];W.edit=null;W.err=""},
wDelOp:v=>{dropPerson(v);if(W.edit===v)A.wCancel()},
wBaja:v=>{const c=S.ops[v];if(c.bajas.some(b=>!b.to))c.bajas=c.bajas.filter(b=>b.to);else c.bajas.push({from:TODAY,to:null})},
qnext:()=>{const nt=document.querySelector("[data-h=nt]");if(nt)S.rules.nota=nt.value;if(S.qi>=QS.length-1){S.done=true;TAB="hoy";window.scrollTo(0,0);toast("¡Todo listo! Pulsa «Generar planning»");return}S.qi++;window.scrollTo(0,0)},
qprev:()=>{S.qi=Math.max(0,S.qi-1)},
/* reglas */
fSepP:v=>{const a=W.f.sp||[];W.f.sp=a.includes(v)?a.filter(x=>x!==v):[...a,v]},fSepAll:()=>{W.f.sp=[...P()]},
rlSepDel:v=>{S.rules.sep.splice(+v,1)},
rlSepAdd:()=>{const a=fv("sa",optP()),b=fv("sb",optP2()),ps=(W.f.sp||[]).filter(p=>P().includes(p));if(!a||!b||a===b){toast("Elige dos personas distintas");return 1}if(!ps.length){toast("Elige en qué puestos");return 1}
if(S.rules.sep.some(x=>(x.a===a&&x.b===b)||(x.a===b&&x.b===a))){toast("Esa pareja ya está");return 1}S.rules.sep.push({a,b,posts:ps});W.f.sp=[];toast("Regla añadida")},
rlFavDel:v=>{S.rules.fav.splice(+v,1)},
rlFavAdd:()=>{const o=fv("fo",optP()),p=fv("fp",optQ()),pct=+fv("fq",[[100],[90],[70],[50]]);if(!o||!p){toast("Faltan datos");return 1}if(!allowed(o,p)){toast(o+" no sabe hacer ese puesto");return 1}S.rules.fav=S.rules.fav.filter(x=>!(x.o===o&&x.p===p));S.rules.fav.push({o,p,pct});toast("Regla añadida")},
rlSplit:v=>{S.split=S.split.includes(v)?S.split.filter(x=>x!==v):[...S.split,v]},
rlMaxDel:v=>{S.rules.max.splice(+v,1)},
rlMaxAdd:()=>{const o=fv("mo",optP()),p=fv("mp",optQ()),n=+fv("mn",[[1],[2],[3]]);if(!o||!p){toast("Faltan datos");return 1}S.rules.max=S.rules.max.filter(x=>!(x.o===o&&x.p===p));S.rules.max.push({o,p,n});toast("Regla añadida")},
rlNorep:v=>{S.rules.norep=v==="true"},rlRot:v=>{S.rules.rot=+v}};
const C={area:v=>{S.area=v.trim()},lider:v=>{S.lider=v.trim()},fs:(v,el)=>{W.f[el.dataset.k]=v},nt:v=>{S.rules.nota=v},bfd:v=>{SHEET.bf=v;if(SHEET.bt&&SHEET.bt<v)SHEET.bt=null},bhd:v=>{SHEET.bt=v},imgf:(v,el)=>{readImg(el.files&&el.files[0],el.dataset.k);el.value="";return 1}};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||!A[b.dataset.a])return;const r=A[b.dataset.a](b.dataset.v,b,e);if(!r){save();render()}});
document.addEventListener("change",e=>{const el=e.target.closest("[data-h]");if(!el||!C[el.dataset.h])return;const r=C[el.dataset.h](el.value,el);if(!r){save();render()}});
document.addEventListener("input",e=>{const el=e.target;if(el&&el.dataset&&el.dataset.h==="q"){QF=el.value;$("tl").innerHTML=teamRows()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&SHEET){SHEET=null;render();return}if(e.key!=="Enter")return;const id=e.target&&e.target.id;const m={wp:S.done?"mAddPost":"wAddPost",wn:"wSave"}[id];if(!m)return;e.preventDefault();const r=A[m]();if(!r){save();render()}});
document.addEventListener("visibilitychange",()=>{if(document.hidden)return;const t=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);if(t!==TODAY){if(S.date===TODAY)S.date=t;TODAY=t;render()}});
render();cloudInit();
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))navigator.serviceWorker.register("sw.js").catch(()=>{});
(async()=>{try{if(!window.claude||!claude.use)return;const s=await claude.use("sample");if(s){SMP=true;render()}}catch(e){}})();
